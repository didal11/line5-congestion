name = "line5-notion-ide"
main = "src/app.js"
compatibility_date = "2026-09-01"

# The embedded IDE serves its bundled editor font from static assets.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
GITHUB_OWNER = "didal11"
GITHUB_REPO = "line5-congestion"
GITHUB_DEFAULT_BRANCH = "main"
WORKSPACE_BRANCH = "notion-workspace"
EXPLORER_ROOT = ""
RUN_ROOT = ""
RUN_WORKFLOW = "notion-ide-run.yml"
