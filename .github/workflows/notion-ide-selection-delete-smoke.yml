name: Notion IDE Explorer Selection Delete Smoke

on:
  push:
    branches:
      - feat/ide-file-import
    paths:
      - .github/workflows/notion-ide-selection-delete-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://line5-notion-ide.alstn101059.workers.dev
      IDE_KEY: ${{ secrets.NOTION_IDE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preview UI controls
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$BASE/" > /tmp/ide.html
          grep -q 'id="folderPicker"' /tmp/ide.html
          grep -q 'webkitdirectory' /tmp/ide.html
          grep -q 'id="deleteSelected"' /tmp/ide.html
          grep -q 'id="addMenu"' /tmp/ide.html
          grep -q 'selectedPaths' /tmp/ide.html
          grep -q 'initMarqueeSelection' /tmp/ide.html

      - name: Seed delete smoke tree
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/seed.json <<'JSON'
          {
            "destination": "notion-ide/.delete-smoke",
            "overwrite": true,
            "files": [
              {"path":"a.txt","content_base64":"YQo="},
              {"path":"folder/x.txt","content_base64":"eAo="},
              {"path":"folder/nested/y.txt","content_base64":"eQo="},
              {"path":"keep.txt","content_base64":"a2VlcAo="}
            ]
          }
          JSON
          HTTP="$(curl --show-error --silent -o /tmp/seed-response.json -w '%{http_code}' \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/seed.json "$BASE/api/import")"
          cat /tmp/seed-response.json
          echo
          test "$HTTP" = "200"
          jq -e '.ok == true and .count == 4' /tmp/seed-response.json >/dev/null

      - name: Delete file and folder in one commit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/delete.json <<'JSON'
          {
            "paths": [
              "notion-ide/.delete-smoke/a.txt",
              "notion-ide/.delete-smoke/folder",
              "notion-ide/.delete-smoke/folder/nested/y.txt"
            ]
          }
          JSON
          HTTP="$(curl --show-error --silent -o /tmp/delete-response.json -w '%{http_code}' \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/delete.json "$BASE/api/delete")"
          cat /tmp/delete-response.json
          echo
          test "$HTTP" = "200"
          jq -e '.ok == true and .count == 2' /tmp/delete-response.json >/dev/null
          jq -e '.paths | sort == ["notion-ide/.delete-smoke/a.txt","notion-ide/.delete-smoke/folder"]' /tmp/delete-response.json >/dev/null
          SHA="$(jq -r '.commit_sha' /tmp/delete-response.json)"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA" > /tmp/delete-commit.json
          jq -e '[.files[].filename] | sort == ["notion-ide/.delete-smoke/a.txt","notion-ide/.delete-smoke/folder/nested/y.txt","notion-ide/.delete-smoke/folder/x.txt"]' /tmp/delete-commit.json >/dev/null

      - name: Verify only keep file remains
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/list?path=notion-ide%2F.delete-smoke" > /tmp/list.json
          cat /tmp/list.json
          jq -e '.items | length == 1 and .[0].name == "keep.txt"' /tmp/list.json >/dev/null

      - name: Clean smoke files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin notion-workspace
          git switch -C notion-workspace origin/notion-workspace
          if [[ -d notion-ide/.delete-smoke ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git rm -r notion-ide/.delete-smoke
            git commit -m 'remove Explorer delete smoke files'
            git push origin HEAD:notion-workspace
          fi
