name: Notion IDE Notebook Run-All Browser Smoke

on:
  push:
    branches:
      - feat/notebook-editor
    paths:
      - .github/workflows/notion-ide-notebook-runall-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://line5-notion-ide.alstn101059.workers.dev
      IDE_KEY: ${{ secrets.NOTION_IDE_KEY }}
      NOTEBOOK_PATH: src/EX_01_Perceptron.ipynb
    steps:
      - name: Wait for run-all preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --show-error --silent "$BASE/notebook-editor.js" -o /tmp/notebook-editor.js \
              && grep -q 'Run All' /tmp/notebook-editor.js \
              && grep -q 'MathJax' /tmp/notebook-editor.js; then
              echo "Preview ready on attempt $attempt"
              exit 0
            fi
            sleep 4
          done
          echo 'Preview did not become ready.' >&2
          exit 1

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          which google-chrome || which chromium || which chromium-browser
          npm install --no-audit --no-fund playwright-core@1.55.0

      - name: Verify hidden stale outputs, math, and Run All wiring
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notebook-runall-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const { execFileSync } = require('node:child_process');
          const candidates=['google-chrome','chromium','chromium-browser'];
          let executablePath='';
          for (const name of candidates) {
            try { executablePath=execFileSync('which',[name],{encoding:'utf8'}).trim(); if(executablePath)break; } catch {}
          }
          if(!executablePath)throw new Error('Chromium executable not found');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1400,height:1000}});
            let queuedPayload=null;
            await page.route('**/api/queue**', async route => {
              const req=route.request();
              const url=new URL(req.url());
              if(url.pathname!=='/api/queue')return route.continue();
              if(req.method()==='POST'){
                queuedPayload=req.postDataJSON();
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,item:{id:'11111111-1111-4111-8111-111111111111',entrypoint:queuedPayload.entrypoint,args:queuedPayload.args||[],status:'WAITING',created_at:new Date().toISOString()}})});
              }
              if(req.method()==='GET')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({active_id:null,items:[]})});
              return route.continue();
            });
            page.on('pageerror', error => console.error('PAGEERROR', error));
            await page.goto(process.env.BASE,{waitUntil:'networkidle'});
            await page.locator('#key').fill(process.env.IDE_KEY);
            await page.locator('#connect').click();
            await page.waitForFunction(()=>document.querySelector('#connection')?.textContent==='connected');
            const src=page.locator('.tree-row[data-path="src"]');
            await src.waitFor({state:'visible'});
            await src.click();
            const row=page.locator(`.tree-row[data-path="${process.env.NOTEBOOK_PATH}"]`);
            await row.waitFor({state:'visible'});
            await row.click();
            await page.locator('#notebookShell:not(.hidden)').waitFor({state:'visible'});
            if(await page.locator('.nb-cell').count()!==10)throw new Error('expected 10 notebook cells');
            const shellText=await page.locator('#notebookShell').innerText();
            if(shellText.includes('NumPy Version :2.0.2'))throw new Error('stale NumPy output is visible');
            if(shellText.includes('y = 1.0'))throw new Error('stale y output is visible');
            if(await page.locator('.nb-output').count()!==0)throw new Error('saved notebook output containers are visible');
            const codeLabels=await page.locator('.nb-cell-label').evaluateAll(nodes=>nodes.map(n=>n.textContent).filter(x=>x==='PY'));
            if(codeLabels.length!==4)throw new Error(`expected 4 PY labels, got ${codeLabels.length}`);
            if(await page.locator('.nb-toolbar button', {hasText:'Raw JSON'}).count())throw new Error('Raw JSON control should be hidden');
            await page.locator('.nb-markdown-render mjx-container').first().waitFor({state:'visible',timeout:15000});
            const formulaText=await page.locator('.nb-markdown-render').nth(1).innerText();
            if(!formulaText.includes('y ='))throw new Error('formula markdown missing');
            const runAll=page.locator('.nb-toolbar button', {hasText:'Run All'});
            await runAll.waitFor({state:'visible'});
            if(await runAll.isDisabled())throw new Error('Run All is disabled');
            if((await page.locator('#run').innerText()).trim()!=='Run All ▶')throw new Error('top Run button did not switch to Run All');
            await runAll.click();
            await page.waitForFunction(()=>document.querySelector('#prodPanel') && !document.querySelector('#prodPanel').classList.contains('hidden'));
            if(!queuedPayload)throw new Error('Run All did not enqueue');
            if(queuedPayload.entrypoint!==process.env.NOTEBOOK_PATH)throw new Error(`wrong queued entrypoint: ${queuedPayload.entrypoint}`);
            console.log('NOTEBOOK_RUN_ALL_UI_OK', JSON.stringify(queuedPayload));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
          BASE="$BASE" IDE_KEY="$IDE_KEY" NOTEBOOK_PATH="$NOTEBOOK_PATH" node /tmp/notebook-runall-smoke.cjs
