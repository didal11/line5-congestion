name: Notion IDE Live Log Smoke

on:
  push:
    branches:
      - notion-workspace
    paths:
      - .github/workflows/notion-ide-live-log-smoke.yml
      - notion-ide/live_log_probe.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live log probe
        shell: bash
        env:
          LIVE_LOG_URL: https://line5-notion-ide.alstn101059.workers.dev/api/live-log
          LIVE_LOG_KEY: ${{ secrets.NOTION_IDE_KEY }}
          LIVE_LOG_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            -H "x-ide-key: $LIVE_LOG_KEY" \
            -H "content-type: application/json" \
            -X POST \
            --data "{\"run_id\":\"$LIVE_LOG_RUN_ID\",\"text\":\"CURL_POST_OK\\n\",\"done\":false}" \
            "$LIVE_LOG_URL" > /tmp/post.json
          cat /tmp/post.json

          curl --fail --show-error --silent \
            -H "x-ide-key: $LIVE_LOG_KEY" \
            "$LIVE_LOG_URL?run_id=$LIVE_LOG_RUN_ID" > /tmp/curl-get.json
          cat /tmp/curl-get.json
          jq -e '.tail | contains("CURL_POST_OK")' /tmp/curl-get.json >/dev/null

          python notion-ide/live_log_exec.py notion-ide/live_log_probe.py &
          PROBE_PID=$!

          sleep 7
          curl --fail --show-error --silent \
            -H "x-ide-key: $LIVE_LOG_KEY" \
            "$LIVE_LOG_URL?run_id=$LIVE_LOG_RUN_ID" > /tmp/live-mid.json
          cat /tmp/live-mid.json

          wait "$PROBE_PID"
