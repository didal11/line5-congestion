name: Patch IDE run lifecycle

on:
  push:
    branches:
      - feat/ide-editor-ui
    paths:
      - .github/workflows/patch-ide-run-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ide-editor-ui

      - name: Patch Worker and UI
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new, 1)

          ui_path = Path("notion-ide/worker/src/ui.js")
          ui = ui_path.read_text(encoding="utf-8")

          ui = replace_once(
              ui,
              '.terminal-status{font-size:11px;color:#666}',
              '.terminal-status{font-size:11px;color:#555;font-weight:700}.terminal-status[data-state="QUEUED"]{color:#7a5b00}.terminal-status[data-state="IN_PROGRESS"]{color:#0550ae}.terminal-status[data-state="SUCCESS"]{color:#116329}.terminal-status[data-state="FAILED"],.terminal-status[data-state="IDE_ERROR"]{color:#9a1b1b}.terminal-status[data-state="CANCELLED"]{color:#666}',
              "terminal status css",
          )
          ui = replace_once(
              ui,
              '<button id="loadLog" disabled>Load log</button>',
              '<button id="cancelRun" disabled>Stop ■</button>\n<button id="loadLog" disabled>Load log</button>',
              "cancel button",
          )
          ui = replace_once(
              ui,
              '</section>\n<div id="error" class="connection-error error hidden"></div>',
              '</section>',
              "bottom error pane",
          )
          ui = replace_once(
              ui,
              'let config=null,currentSha=null,runCommit=null,runId=null,jobId=null,pollTimer=null,selectedRow=null,currentPath="",lastRunCommand="";',
              'let config=null,currentSha=null,runCommit=null,runId=null,jobId=null,pollTimer=null,selectedRow=null,currentPath="",lastRunCommand="",lastLifecycle="IDLE",cancelRequested=false;',
              "run lifecycle vars",
          )
          old_api = '''async function api(path,options={}){options.headers={...apiHeaders(Boolean(options.body)),...(options.headers||{})};const r=await fetch(path,options);const t=await r.text();let data=t;try{data=JSON.parse(t)}catch{}if(!r.ok)throw new Error(typeof data==="string"?data:JSON.stringify(data,null,2));return data}\nfunction showError(e){const box=$("error");box.textContent=e?String(e.message||e):"";box.classList.toggle("hidden",!e)}'''
          new_api = '''function friendlyError(value){const text=String(value?.message||value||"unknown error");if(/Worker threw exception|Error 1101|cf-error-code[^0-9]*1101/i.test(text))return "Cloudflare Worker error 1101";if(/<html|<!doctype/i.test(text))return "server returned an HTML error page";return text.length>1200?text.slice(0,1200)+"…":text}\nasync function api(path,options={},retry=true){options.headers={...apiHeaders(Boolean(options.body)),...(options.headers||{})};let r;try{r=await fetch(path,options)}catch(e){if(retry){await new Promise(resolve=>setTimeout(resolve,900));return api(path,options,false)}throw e}const t=await r.text();let data=t;try{data=JSON.parse(t)}catch{}if(!r.ok){const message=typeof data==="string"?friendlyError(data):friendlyError(JSON.stringify(data,null,2));if(retry&&r.status>=500){await new Promise(resolve=>setTimeout(resolve,900));return api(path,options,false)}throw new Error("HTTP "+r.status+": "+message)}return data}\nfunction setRunState(state){lastLifecycle=state;const el=$("terminalStatus");if(!el)return;el.textContent=state==="IDLE"?"":state;el.dataset.state=state.split(" ")[0]}\nfunction showError(e){if(!e)return;setRunState("IDE_ERROR");appendTerminal("[IDE ERROR] "+friendlyError(e));updateRunButton()}'''
          ui = replace_once(ui, old_api, new_api, "api error handling")
          ui = replace_once(
              ui,
              'function updateRunButton(){$("run").disabled=!config||!isPythonPath(currentPath)}',
              'function updateRunButton(){const active=["REQUESTING","WAITING_FOR_RUN","QUEUED","IN_PROGRESS","CANCEL_REQUESTED"].some(s=>lastLifecycle.startsWith(s));$("run").disabled=!config||!isPythonPath(currentPath)||active;if($("cancelRun"))$("cancelRun").disabled=!runId||!active||lastLifecycle.startsWith("CANCEL_REQUESTED")}',
              "run button state",
          )

          run_block = re.compile(r'async function run\(\)\{.*?\nasync function loadArtifacts\(\)\{', re.S)
          replacement = '''async function run(){showError();const entrypoint=currentEntrypoint();if(currentBuffer()?.dirty)await saveFile();lastRunCommand=pythonCommand(entrypoint);runCommit=null;runId=null;jobId=null;cancelRequested=false;$("terminalCommand").textContent="$ "+lastRunCommand;$("runLink").textContent="";$("artifactLinks").textContent="";$("loadLog").disabled=true;$("cancelRun").disabled=true;setRunState("REQUESTING");updateRunButton();setTerminal("$ "+lastRunCommand+"\\n\\nSTATE: REQUESTING\\nCreating run request commit...");const d=await api("/api/run",{method:"POST",body:JSON.stringify({entrypoint})});runCommit=d.commit_sha;setRunState("WAITING_FOR_RUN");setTerminal("$ "+lastRunCommand+"\\n\\nSTATE: WAITING_FOR_RUN\\nRun request committed: "+runCommit.slice(0,8)+"\\nWaiting for GitHub Actions to create the workflow run...");if(pollTimer)clearTimeout(pollTimer);await pollRun()}\nfunction lifecycleFromRun(run){if(run.status==="queued")return "QUEUED";if(run.status==="in_progress")return "IN_PROGRESS";if(run.status!=="completed")return String(run.status||"UNKNOWN").toUpperCase();const c=String(run.conclusion||"completed").toLowerCase();if(c==="success")return "SUCCESS";if(c==="failure")return "FAILED";if(c==="cancelled")return "CANCELLED";if(c==="timed_out")return "TIMED_OUT";return c.toUpperCase()}\nasync function pollRun(){if(!runCommit)return;try{const d=await api("/api/run-status?sha="+encodeURIComponent(runCommit));if(!d.found){setRunState("WAITING_FOR_RUN");setTerminal("$ "+lastRunCommand+"\\n\\nSTATE: WAITING_FOR_RUN\\nRequest commit: "+runCommit.slice(0,8)+"\\nGitHub Actions has not created the run yet.");updateRunButton();pollTimer=setTimeout(pollRun,3000);return}runId=d.run.id;jobId=d.jobs[0]?.id||null;const actual=lifecycleFromRun(d.run);const state=cancelRequested&&d.run.status!=="completed"?"CANCEL_REQUESTED · "+actual:actual;setRunState(state);$("runLink").innerHTML="<a target='_blank' rel='noreferrer' href='"+d.run.html_url+"'>run "+d.run.id+"</a>";const steps=terminalSteps(d);setTerminal("$ "+lastRunCommand+"\\n\\nSTATE: "+state+"\\nGitHub status: "+d.run.status+(d.run.conclusion?" / "+d.run.conclusion:"")+(steps?"\\n\\n"+steps:""));updateRunButton();if(d.run.status!=="completed"){pollTimer=setTimeout(pollRun,3000)}else{$("cancelRun").disabled=true;$("loadLog").disabled=!jobId;await loadArtifacts();if(jobId)await loadLog();updateRunButton()}}catch(e){setRunState("IDE_ERROR");appendTerminal("[IDE ERROR] "+friendlyError(e)+"\\n[RETRYING] status check in 7 seconds");updateRunButton();pollTimer=setTimeout(pollRun,7000)}}\nasync function cancelRun(){if(!runId)throw new Error("GitHub run has not been created yet");cancelRequested=true;setRunState("CANCEL_REQUESTED");updateRunButton();appendTerminal("[CANCEL_REQUESTED] asking GitHub to stop run "+runId+"...");try{const d=await api("/api/cancel",{method:"POST",body:JSON.stringify({run_id:runId})});appendTerminal("[CANCEL_REQUESTED] request committed: "+d.commit_sha.slice(0,8));if(!pollTimer)pollTimer=setTimeout(pollRun,1000)}catch(e){cancelRequested=false;showError(e);throw e}}\nasync function loadArtifacts(){'''
          ui, count = run_block.subn(lambda _m: replacement, ui, count=1)
          if count != 1:
              raise SystemExit(f"run block replacement count: {count}")

          ui = replace_once(
              ui,
              '$("run").onclick=()=>run().catch(e=>{showError(e);updateRunButton()});$("loadLog").onclick=()=>loadLog().catch(showError);',
              '$("run").onclick=()=>run().catch(e=>{showError(e);updateRunButton()});$("cancelRun").onclick=()=>cancelRun().catch(()=>{});$("loadLog").onclick=()=>loadLog().catch(showError);',
              "cancel event binding",
          )
          ui_path.write_text(ui, encoding="utf-8")

          app_path = Path("notion-ide/worker/src/app.js")
          app = app_path.read_text(encoding="utf-8")
          cancel_fn = '''async function apiCancel(request, env) {\n  await ensureWorkspaceBranch(env);\n  const body = await request.json();\n  const runId = String(body.run_id || "");\n  if (!/^\\d+$/.test(runId)) throw new HttpError(400, "invalid run id");\n  const requestId = crypto.randomUUID();\n  const requestPath = "notion-ide/cancel-request.json";\n  let currentSha = null;\n  try { currentSha = (await getContent(env, requestPath)).sha; }\n  catch (error) { if (!(error instanceof HttpError) || error.status !== 404) throw error; }\n  const cancelRequest = JSON.stringify({ request_id: requestId, run_id: Number(runId), requested_at: new Date().toISOString() }, null, 2) + "\\n";\n  const result = await putContent(env, requestPath, cancelRequest, `notion ide: cancel run ${runId}`, currentSha);\n  return json({ request_id: requestId, run_id: Number(runId), commit_sha: result.commit.sha });\n}\n\n'''
          marker = 'async function apiRunStatus(url, env) {'
          if 'async function apiCancel(request, env)' not in app:
              if marker not in app:
                  raise SystemExit("apiRunStatus marker missing")
              app = app.replace(marker, cancel_fn + marker, 1)
          app = replace_once(
              app,
              '      if (url.pathname === "/api/run" && request.method === "POST") return apiRun(request, env);',
              '      if (url.pathname === "/api/run" && request.method === "POST") return apiRun(request, env);\n      if (url.pathname === "/api/cancel" && request.method === "POST") return apiCancel(request, env);',
              "cancel route",
          )
          app_path.write_text(app, encoding="utf-8")

          gh_token_expr = "$" + "{{ github.token }}"
          run_id_expr = "$" + "{{ steps.request.outputs.run_id }}"
          cancel_workflow = '''name: Notion IDE Cancel\n\non:\n  push:\n    branches:\n      - notion-workspace\n    paths:\n      - notion-ide/cancel-request.json\n\npermissions:\n  actions: write\n  contents: read\n\njobs:\n  cancel-run:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Resolve requested run\n        id: request\n        shell: bash\n        run: |\n          RUN_ID="$(python - <<'PY'\n          import json\n          from pathlib import Path\n          data = json.loads(Path('notion-ide/cancel-request.json').read_text(encoding='utf-8'))\n          run_id = str(data['run_id'])\n          if not run_id.isdigit():\n              raise SystemExit('invalid run id')\n          print(run_id)\n          PY\n          )"\n          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"\n\n      - name: Cancel workflow run\n        shell: bash\n        env:\n          GH_TOKEN: __GH_TOKEN__\n        run: |\n          set -euo pipefail\n          RUN_ID='__RUN_ID__'\n          STATUS="$(curl --show-error --silent \\\n            -o /tmp/cancel-response.txt -w '%{http_code}' \\\n            -X POST \\\n            -H "Accept: application/vnd.github+json" \\\n            -H "Authorization: Bearer $GH_TOKEN" \\\n            -H "X-GitHub-Api-Version: 2022-11-28" \\\n            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel")"\n          cat /tmp/cancel-response.txt || true\n          echo "Cancel HTTP: $STATUS"\n          if [[ "$STATUS" != "202" && "$STATUS" != "409" ]]; then\n            exit 1\n          fi\n'''
          cancel_workflow = cancel_workflow.replace("__GH_TOKEN__", gh_token_expr).replace("__RUN_ID__", run_id_expr)
          Path(".github/workflows/notion-ide-cancel.yml").write_text(cancel_workflow, encoding="utf-8")

      - name: Validate patched files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check notion-ide/worker/src/app.js
          node --check notion-ide/worker/src/ui.js
          python - <<'PY'
          from pathlib import Path
          source = Path('notion-ide/worker/src/ui.js').read_text(encoding='utf-8')
          start = source.index('<script>') + len('<script>')
          end = source.index('</script>', start)
          Path('/tmp/notion-ide-browser.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/notion-ide-browser.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notion-ide/worker/src/ui.js notion-ide/worker/src/app.js .github/workflows/notion-ide-cancel.yml
          git commit -m 'show runner lifecycle and support cancellation'
          git push origin HEAD:feat/ide-editor-ui
