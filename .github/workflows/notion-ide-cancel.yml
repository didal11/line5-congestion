name: Notion IDE Cancel

on:
  push:
    branches:
      - notion-workspace
    paths:
      - notion-ide/cancel-request.json

permissions:
  actions: write
  contents: read

jobs:
  cancel-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve requested run
        id: request
        shell: bash
        run: |
          RUN_ID="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('notion-ide/cancel-request.json').read_text(encoding='utf-8'))
          run_id = str(data['run_id'])
          if not run_id.isdigit():
              raise SystemExit('invalid run id')
          print(run_id)
          PY
          )"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Cancel workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID='${{ steps.request.outputs.run_id }}'
          STATUS="$(curl --show-error --silent \
            -o /tmp/cancel-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel")"
          cat /tmp/cancel-response.txt || true
          echo "Cancel HTTP: $STATUS"
          if [[ "$STATUS" != "202" && "$STATUS" != "409" ]]; then
            exit 1
          fi
