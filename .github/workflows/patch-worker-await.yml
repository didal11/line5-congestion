name: Patch Worker Await

on:
  push:
    branches:
      - feat/ide-editor-ui
    paths:
      - .github/workflows/patch-worker-await.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ide-editor-ui
      - name: Await async handlers
        shell: python
        run: |
          from pathlib import Path
          p=Path('notion-ide/worker/src/app.js')
          s=p.read_text(encoding='utf-8')
          routes=['apiBootstrap(env)','apiList(url, env)','apiFileGet(url, env)','apiFilePut(request, env)','apiRun(request, env)','apiCancel(request, env)','apiRunStatus(url, env)','apiArtifacts(url, env)','apiArtifactDownload(url, env)','apiJobLog(url, env)']
          for call in routes:
              old='return '+call+';'
              new='return await '+call+';'
              if old not in s:
                  raise SystemExit('missing '+old)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: node --check notion-ide/worker/src/app.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notion-ide/worker/src/app.js
          git commit -m 'catch asynchronous Worker API failures'
          git push origin HEAD:feat/ide-editor-ui
