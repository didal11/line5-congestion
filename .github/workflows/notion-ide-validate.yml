name: Validate Notion IDE

# Validate Worker changes on any branch before they reach main.
on:
  push:
    branches:
      - "**"
    paths:
      - notion-ide/worker/**
      - .github/workflows/notion-ide-*.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check notion-ide/worker/src/index.js
          node --check notion-ide/worker/src/app.js
          node --check notion-ide/worker/src/ui.js

      - name: Install Wrangler
        working-directory: notion-ide/worker
        run: npm install --no-audit --no-fund

      - name: Build Worker
        working-directory: notion-ide/worker
        run: npx wrangler deploy --dry-run
