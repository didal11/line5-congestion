name: Validate Notion IDE

# Validate Worker changes on any branch before they reach main.
on:
  push:
    branches:
      - "**"
    paths:
      - notion-ide/worker/**
      - notion-ide/live_log_exec.py
      - .github/workflows/notion-ide-*.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker JavaScript syntax
        run: |
          node --check notion-ide/worker/src/index.js
          node --check notion-ide/worker/src/app.js
          node --check notion-ide/worker/src/ui.js
          node --check notion-ide/worker/src/file-import.js
          node --check notion-ide/worker/src/file-delete.js
          node --check notion-ide/worker/src/file-ops.js
          node --check notion-ide/worker/src/file-download.js
          node --check notion-ide/worker/src/search.js
          node --check notion-ide/worker/src/history.js
          node --check notion-ide/worker/src/run-queue.js
          node --check notion-ide/worker/public/ide-productivity.js

      - name: Check Python runner wrapper
        run: python -m py_compile notion-ide/live_log_exec.py

      - name: Verify structured run arguments
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notion_args_probe.py <<'PY'
          import json
          import sys
          print(json.dumps(sys.argv[1:], ensure_ascii=False))
          PY
          NOTION_IDE_ARGS_JSON='["hello world","--flag","A B"]' \
            python notion-ide/live_log_exec.py /tmp/notion_args_probe.py > /tmp/notion_args_output.txt
          cat /tmp/notion_args_output.txt
          grep -F '["hello world", "--flag", "A B"]' /tmp/notion_args_output.txt

      - name: Check embedded browser script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('notion-ide/worker/src/ui.js').read_text(encoding='utf-8')
          start = source.index('<script>') + len('<script>')
          end = source.index('</script>', start)
          Path('/tmp/notion-ide-browser.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/notion-ide-browser.js

      - name: Install Wrangler
        working-directory: notion-ide/worker
        run: npm install --no-audit --no-fund

      - name: Build Worker
        working-directory: notion-ide/worker
        run: npx wrangler deploy --dry-run
