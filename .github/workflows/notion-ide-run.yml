name: Notion IDE Run

on:
  push:
    branches:
      - notion-workspace
    paths:
      - notion-ide/run-request.json
  workflow_dispatch:
    inputs:
      entrypoint:
        description: Python module or relative .py path from the repository root
        required: true
        default: src.train

permissions:
  contents: read

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Build Python environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --upgrade -r requirements.txt

      - name: Save Python environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Resolve entrypoint
        id: request
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENTRYPOINT='${{ inputs.entrypoint }}'
          else
            ENTRYPOINT="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('notion-ide/run-request.json').read_text(encoding='utf-8'))
          print(data['entrypoint'])
          PY
          )"
          fi
          python - "$ENTRYPOINT" <<'PY'
          import re
          import sys
          value = sys.argv[1]
          if not value or '..' in value or not re.fullmatch(r'[A-Za-z0-9_./-]+', value):
              raise SystemExit(f'invalid entrypoint: {value!r}')
          PY
          echo "entrypoint=$ENTRYPOINT" >> "$GITHUB_OUTPUT"

      - name: Run Python
        shell: bash
        run: |
          PYTHON='.venv/bin/python'
          ENTRYPOINT='${{ steps.request.outputs.entrypoint }}'
          if [[ "$ENTRYPOINT" != *.py ]]; then
            echo "+ $PYTHON -m $ENTRYPOINT"
            "$PYTHON" -m "$ENTRYPOINT"
            exit $?
          fi

          MODULE="${ENTRYPOINT%.py}"
          MODULE="${MODULE//\//.}"
          PACKAGE_DIR="$(dirname "$ENTRYPOINT")"
          IS_PACKAGE=true

          if [[ "$PACKAGE_DIR" == "." ]]; then
            IS_PACKAGE=false
          else
            CURRENT=""
            IFS='/' read -ra PARTS <<< "$PACKAGE_DIR"
            for PART in "${PARTS[@]}"; do
              CURRENT="${CURRENT:+$CURRENT/}$PART"
              if [[ ! -f "$CURRENT/__init__.py" ]]; then
                IS_PACKAGE=false
                break
              fi
            done
          fi

          if [[ "$IS_PACKAGE" == true ]]; then
            echo "+ $PYTHON -m $MODULE"
            "$PYTHON" -m "$MODULE"
          else
            echo "+ $PYTHON $ENTRYPOINT"
            "$PYTHON" "$ENTRYPOINT"
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-ide-result-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            models/**
            results/**
