name: Notion IDE Run

on:
  push:
    branches:
      - notion-workspace
    paths:
      - notion-ide/run-request.json
  workflow_dispatch:
    inputs:
      entrypoint:
        description: Python module or relative .py path from the repository root
        required: true
        default: src.train
      args_json:
        description: JSON array of command-line argument strings
        required: false
        default: "[]"

permissions:
  contents: read

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Build Python environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --upgrade -r requirements.txt

      - name: Save Python environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENTRYPOINT: ${{ inputs.entrypoint }}
          DISPATCH_ARGS_JSON: ${{ inputs.args_json }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              entrypoint = os.environ.get("DISPATCH_ENTRYPOINT", "")
              raw_args = os.environ.get("DISPATCH_ARGS_JSON", "[]") or "[]"
              try:
                  args = json.loads(raw_args)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"invalid args_json: {exc}")
          else:
              data = json.loads(Path("notion-ide/run-request.json").read_text(encoding="utf-8"))
              entrypoint = data.get("entrypoint", "")
              args = data.get("args", [])

          if not entrypoint or ".." in entrypoint or not re.fullmatch(r"[A-Za-z0-9_./-]+", entrypoint):
              raise SystemExit(f"invalid entrypoint: {entrypoint!r}")
          if not isinstance(args, list) or not all(isinstance(item, str) for item in args):
              raise SystemExit("args must be a JSON array of strings")
          if len(args) > 40 or sum(len(item) for item in args) > 6000:
              raise SystemExit("run arguments exceed IDE limits")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"entrypoint={entrypoint}", file=output)
              print("args_json=" + json.dumps(args, ensure_ascii=False, separators=(",", ":")), file=output)
          PY

      - name: Run Python
        shell: bash
        env:
          ENTRYPOINT: ${{ steps.request.outputs.entrypoint }}
          NOTION_IDE_ARGS_JSON: ${{ steps.request.outputs.args_json }}
          LIVE_LOG_URL: https://line5-notion-ide.alstn101059.workers.dev/api/live-log
          LIVE_LOG_KEY: ${{ secrets.NOTION_IDE_KEY }}
          LIVE_LOG_RUN_ID: ${{ github.run_id }}
        run: |
          .venv/bin/python notion-ide/live_log_exec.py "$ENTRYPOINT"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-ide-result-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            models/**
            results/**
