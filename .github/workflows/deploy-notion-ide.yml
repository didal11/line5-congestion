name: Deploy Notion IDE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ide-productivity-pack
    paths:
      - notion-ide/worker/**
      - .github/workflows/deploy-notion-ide.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: notion-ide/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set GitHub token secret
        shell: bash
        run: printf '%s' "$WORKER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}

      - name: Set IDE key secret
        shell: bash
        run: printf '%s' "$NOTION_IDE_KEY" | npx wrangler secret put IDE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_IDE_KEY: ${{ secrets.NOTION_IDE_KEY }}

      - name: Verify workers.dev HTTPS
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://line5-notion-ide.alstn101059.workers.dev/ > /tmp/notion-ide.html
          test -s /tmp/notion-ide.html

      - name: Smoke test bundled editor font
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://line5-notion-ide.alstn101059.workers.dev'
          FONT_STATUS="$(curl --show-error --silent \
            -o /tmp/CascadiaCode-Regular.woff2 -w '%{http_code}' \
            "$BASE/fonts/CascadiaCode-Regular.woff2")"
          echo "Font HTTP: $FONT_STATUS"
          test "$FONT_STATUS" = "200"
          FONT_BYTES="$(wc -c < /tmp/CascadiaCode-Regular.woff2)"
          echo "Font bytes: $FONT_BYTES"
          test "$FONT_BYTES" -gt 100000
          grep -q 'CascadiaCode-Regular.woff2' /tmp/notion-ide.html
          grep -q 'id="activeLine"' /tmp/notion-ide.html
          grep -q 'ide-productivity.js' /tmp/notion-ide.html

      - name: Smoke test explorer API
        shell: bash
        env:
          NOTION_IDE_KEY: ${{ secrets.NOTION_IDE_KEY }}
        run: |
          set -euo pipefail
          BASE='https://line5-notion-ide.alstn101059.workers.dev'
          BOOT_STATUS="$(curl --show-error --silent \
            -H "x-ide-key: $NOTION_IDE_KEY" \
            -X POST -o /tmp/bootstrap.json -w '%{http_code}' \
            "$BASE/api/bootstrap")"
          echo "Bootstrap HTTP: $BOOT_STATUS"
          cat /tmp/bootstrap.json
          echo
          test "$BOOT_STATUS" = "200"
          jq -e '.run_root == ""' /tmp/bootstrap.json >/dev/null

          LIST_STATUS="$(curl --show-error --silent \
            -H "x-ide-key: $NOTION_IDE_KEY" \
            -o /tmp/root.json -w '%{http_code}' \
            "$BASE/api/list?path=")"
          echo "Explorer list HTTP: $LIST_STATUS"
          cat /tmp/root.json
          echo
          test "$LIST_STATUS" = "200"
          COUNT="$(jq '.items | length' /tmp/root.json)"
          echo "Explorer root item count: $COUNT"
          test "$COUNT" -gt 0
          jq -e '.items | any(.name == "src")' /tmp/root.json >/dev/null
          jq -e '.items | all(.name != "reference")' /tmp/root.json >/dev/null
