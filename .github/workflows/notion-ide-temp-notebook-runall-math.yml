name: Temporary Notebook Run-All Math Patch

on:
  push:
    branches:
      - feat/notebook-editor
    paths:
      - .github/scripts/patch_notebook_runall_math.py
      - .github/workflows/notion-ide-temp-notebook-runall-math.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply notebook run-all/math patch
        run: python .github/scripts/patch_notebook_runall_math.py

      - name: Check JavaScript syntax
        run: |
          node --check notion-ide/worker/src/ui.js
          node --check notion-ide/worker/public/notebook-editor.js

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add notion-ide/worker/src/ui.js notion-ide/worker/public/notebook-editor.js
          if git diff --cached --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git commit -m 'add notebook run-all and math rendering'
          git push
