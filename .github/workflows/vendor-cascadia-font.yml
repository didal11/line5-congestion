name: Vendor Cascadia Code

on:
  push:
    branches:
      - feat/ide-editor-ui
    paths:
      - .github/workflows/vendor-cascadia-font.yml

permissions:
  contents: write

jobs:
  vendor-font:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ide-editor-ui

      - name: Download and vendor Cascadia Code
        shell: bash
        run: |
          set -euo pipefail
          VERSION='2407.24'
          ZIP='/tmp/CascadiaCode.zip'
          OUT='/tmp/cascadia'
          URL="https://github.com/microsoft/cascadia-code/releases/download/v${VERSION}/CascadiaCode-${VERSION}.zip"
          EXPECTED='E67A68EE3386DB63F48B9054BD196EA752BC6A4EBB4DF35ADCE6733DA50C8474'

          curl --fail --location --silent --show-error "$URL" -o "$ZIP"
          printf '%s  %s\n' "$EXPECTED" "$ZIP" | sha256sum --check --strict
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"

          FONT="$(find "$OUT" -type f -name 'CascadiaCode-Regular.woff2' -print -quit)"
          if [[ -z "$FONT" ]]; then
            FONT="$(find "$OUT" -type f -name 'CascadiaCode.woff2' -print -quit)"
          fi
          test -n "$FONT"

          mkdir -p notion-ide/worker/public/fonts
          cp "$FONT" notion-ide/worker/public/fonts/CascadiaCode-Regular.woff2
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/microsoft/cascadia-code/v${VERSION}/LICENSE" \
            -o notion-ide/worker/public/fonts/CascadiaCode-LICENSE.txt

          test -s notion-ide/worker/public/fonts/CascadiaCode-Regular.woff2
          test -s notion-ide/worker/public/fonts/CascadiaCode-LICENSE.txt

      - name: Commit vendored font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notion-ide/worker/public/fonts/CascadiaCode-Regular.woff2 \
                  notion-ide/worker/public/fonts/CascadiaCode-LICENSE.txt
          if git diff --cached --quiet; then
            echo 'Font already vendored.'
            exit 0
          fi
          git commit -m 'vendor Cascadia Code web font'
          git push origin HEAD:feat/ide-editor-ui
