name: Notion IDE Productivity Pack Smoke

on:
  push:
    branches:
      - feat/ide-productivity-pack
    paths:
      - .github/workflows/notion-ide-productivity-smoke.yml

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://line5-notion-ide.alstn101059.workers.dev
      IDE_KEY: ${{ secrets.NOTION_IDE_KEY }}
      SMOKE_ROOT: notion-ide/.prod-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify productivity UI asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$BASE/" > /tmp/ide.html
          grep -q 'ide-productivity.js' /tmp/ide.html
          curl --fail --show-error --silent "$BASE/ide-productivity.js" > /tmp/productivity.js
          grep -q 'RUN QUEUE' /tmp/productivity.js
          grep -q 'IDE HISTORY' /tmp/productivity.js
          grep -q 'Project text' /tmp/productivity.js
          grep -q 'New Folder' /tmp/productivity.js
          grep -q 'Insert current Python file before this run' /tmp/productivity.js
          grep -q 'Drag to reorder queued run' /tmp/productivity.js
          grep -q '/api/queue/reorder' /tmp/productivity.js
          grep -q '/api/queue/remove' /tmp/productivity.js

      - name: Seed smoke workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/import.json <<'JSON'
          {
            "destination": "notion-ide/.prod-smoke",
            "overwrite": true,
            "files": [
              {"path":"needle.txt","content_base64":"UFJPRFVDVElWSVRZX05FRURMRV85OTMzNwo="},
              {"path":"nested/inside.txt","content_base64":"Zm9sZGVyLWRvd25sb2FkLXByb2JlCg=="},
              {"path":"queue_probe.py","content_base64":"aW1wb3J0IHRpbWUKcHJpbnQoJ1BST0RVQ1RJVklUWV9RVUVVRV9QUk9CRScsIGZsdXNoPVRydWUpCnRpbWUuc2xlZXAoMikK"}
            ]
          }
          JSON
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/import.json "$BASE/api/import" | tee /tmp/seed.json
          jq -e '.ok == true and .count == 3' /tmp/seed.json >/dev/null

      - name: Create and verify empty folder
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data '{"path":"notion-ide/.prod-smoke/empty"}' "$BASE/api/mkdir" | tee /tmp/mkdir.json
          jq -e '.ok == true' /tmp/mkdir.json >/dev/null
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/list?path=notion-ide%2F.prod-smoke%2Fempty" | tee /tmp/empty-list.json
          jq -e '.items | length == 0' /tmp/empty-list.json >/dev/null

      - name: Rename with one move commit
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/move.json <<'JSON'
          {"moves":[{"from":"notion-ide/.prod-smoke/needle.txt","to":"notion-ide/.prod-smoke/renamed.txt"}]}
          JSON
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/move.json "$BASE/api/move" | tee /tmp/move-result.json
          jq -e '.ok == true and (.commit_sha | length == 40) and (.moves | length == 1)' /tmp/move-result.json >/dev/null
          echo "sha=$(jq -r .commit_sha /tmp/move-result.json)" >> "$GITHUB_OUTPUT"

      - name: Search workspace name and text
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/search?mode=name&q=renamed.txt" | tee /tmp/name-search.json
          jq -e '.results | any(.path == "notion-ide/.prod-smoke/renamed.txt")' /tmp/name-search.json >/dev/null
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/search?mode=text&q=PRODUCTIVITY_NEEDLE_99337" | tee /tmp/text-search.json
          jq -e '.results | any(.path == "notion-ide/.prod-smoke/renamed.txt" and .line == 1)' /tmp/text-search.json >/dev/null

      - name: Download file and folder ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/download?path=notion-ide%2F.prod-smoke%2Frenamed.txt" -o /tmp/renamed.txt
          grep -qx 'PRODUCTIVITY_NEEDLE_99337' /tmp/renamed.txt
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/download?path=notion-ide%2F.prod-smoke%2Fnested" -o /tmp/nested.zip
          test "$(od -An -tx1 -N4 /tmp/nested.zip | tr -d ' \n')" = '504b0304'
          unzip -p /tmp/nested.zip inside.txt | grep -qx 'folder-download-probe'

      - name: Verify history and safe revert
        shell: bash
        env:
          MOVE_SHA: ${{ steps.rename.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/history?limit=40" | tee /tmp/history.json
          jq -e --arg sha "$MOVE_SHA" '.items | any(.sha == $sha)' /tmp/history.json >/dev/null
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data "{\"commit_sha\":\"$MOVE_SHA\"}" "$BASE/api/revert" | tee /tmp/revert.json
          jq -e '.ok == true and (.paths | index("notion-ide/.prod-smoke/needle.txt")) != null and (.paths | index("notion-ide/.prod-smoke/renamed.txt")) != null' /tmp/revert.json >/dev/null
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/download?path=notion-ide%2F.prod-smoke%2Fneedle.txt" -o /tmp/reverted.txt
          grep -qx 'PRODUCTIVITY_NEEDLE_99337' /tmp/reverted.txt

      - name: Move a folder recursively
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data '{"moves":[{"from":"notion-ide/.prod-smoke/nested","to":"notion-ide/.prod-smoke/moved-nested"}]}' \
            "$BASE/api/move" | tee /tmp/folder-move.json
          jq -e '.ok == true' /tmp/folder-move.json >/dev/null
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" \
            "$BASE/api/download?path=notion-ide%2F.prod-smoke%2Fmoved-nested" -o /tmp/moved.zip
          unzip -p /tmp/moved.zip inside.txt | grep -qx 'folder-download-probe'

      - name: Check whether queue smoke is safe
        id: queue-safe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" "$BASE/api/queue" | tee /tmp/queue-before.json
          NON_TERMINAL="$(jq '[.items[] | select(.status != "SUCCESS" and .status != "FAILED" and .status != "CANCELLED" and .status != "TIMED_OUT" and .status != "IDE_ERROR")] | length' /tmp/queue-before.json)"
          ACTIVE_COUNT="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/${{ github.repository }}/actions/workflows/notion-ide-run.yml/runs?branch=notion-workspace&status=in_progress&per_page=10' | jq '.total_count')"
          if [[ "$NON_TERMINAL" = "0" && "$ACTIVE_COUNT" = "0" ]]; then
            curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
              -X POST --data '{}' "$BASE/api/queue/clear" >/tmp/qclear-before.json
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo "Queue smoke skipped: non-terminal=$NON_TERMINAL active-runs=$ACTIVE_COUNT"
            echo 'safe=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify editable sequential queue
        if: steps.queue-safe.outputs.safe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ENTRY='notion-ide/.prod-smoke/queue_probe.py'
          enqueue() {
            local before="${1:-}"
            if [[ -n "$before" ]]; then
              curl --fail --show-error --silent \
                -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
                -X POST --data "{\"entrypoint\":\"$ENTRY\",\"args\":[],\"before_id\":\"$before\"}" "$BASE/api/queue"
            else
              curl --fail --show-error --silent \
                -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
                -X POST --data "{\"entrypoint\":\"$ENTRY\",\"args\":[]}" "$BASE/api/queue"
            fi
          }

          enqueue | tee /tmp/q1.json
          ID1="$(jq -r '.item.id' /tmp/q1.json)"
          test -n "$ID1"

          ACTIVE=0
          for attempt in $(seq 1 20); do
            curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" "$BASE/api/queue" > /tmp/qstate.json
            ACTIVE_ID="$(jq -r '.active_id // ""' /tmp/qstate.json)"
            S1="$(jq -r --arg id "$ID1" '.items[] | select(.id==$id) | .status' /tmp/qstate.json)"
            echo "activate q1 attempt=$attempt active=$ACTIVE_ID status=$S1"
            if [[ "$ACTIVE_ID" = "$ID1" && "$S1" != "WAITING" ]]; then ACTIVE=1; break; fi
            sleep 1
          done
          test "$ACTIVE" = "1"

          # Two concurrent enqueues reproduce the lost-update race that existed before serialization.
          enqueue > /tmp/q2.json & P2=$!
          enqueue > /tmp/q3.json & P3=$!
          wait "$P2"; wait "$P3"
          ID2="$(jq -r '.item.id' /tmp/q2.json)"
          ID3="$(jq -r '.item.id' /tmp/q3.json)"
          test -n "$ID2"; test -n "$ID3"; test "$ID2" != "$ID3"

          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" "$BASE/api/queue" > /tmp/q-after-concurrent.json
          jq -e --arg a "$ID2" --arg b "$ID3" '([.items[].id] | index($a)) != null and ([.items[].id] | index($b)) != null' /tmp/q-after-concurrent.json >/dev/null
          jq -e --arg a "$ID2" --arg b "$ID3" '[.items[] | select(.status=="WAITING") | .id] | (index($a) != null and index($b) != null)' /tmp/q-after-concurrent.json >/dev/null

          # Insert Q4 directly before Q3.
          enqueue "$ID3" | tee /tmp/q4.json
          ID4="$(jq -r '.item.id' /tmp/q4.json)"
          test -n "$ID4"
          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" "$BASE/api/queue" > /tmp/q-insert.json
          python - /tmp/q-insert.json "$ID4" "$ID3" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          waiting=[x['id'] for x in data['items'] if x['status']=='WAITING']
          assert waiting.index(sys.argv[2]) + 1 == waiting.index(sys.argv[3]), waiting
          PY

          # Reorder Q3 before Q4, then remove Q2 entirely from the waiting queue.
          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data "{\"id\":\"$ID3\",\"before_id\":\"$ID4\"}" "$BASE/api/queue/reorder" | tee /tmp/q-reorder.json
          jq -e '.ok == true' /tmp/q-reorder.json >/dev/null

          curl --fail --show-error --silent \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data "{\"id\":\"$ID2\"}" "$BASE/api/queue/remove" | tee /tmp/q-remove.json
          jq -e --arg id "$ID2" '.ok == true and .removed_id == $id' /tmp/q-remove.json >/dev/null

          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" "$BASE/api/queue" > /tmp/q-edited.json
          jq -e --arg q3 "$ID3" --arg q4 "$ID4" '[.items[] | select(.status=="WAITING") | .id] == [$q3,$q4]' /tmp/q-edited.json >/dev/null
          jq -e --arg removed "$ID2" '([.items[].id] | index($removed)) == null' /tmp/q-edited.json >/dev/null

          OK=0
          for attempt in $(seq 1 120); do
            curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" "$BASE/api/queue" > /tmp/qstate.json
            S1="$(jq -r --arg id "$ID1" '.items[] | select(.id==$id) | .status' /tmp/qstate.json)"
            S3="$(jq -r --arg id "$ID3" '.items[] | select(.id==$id) | .status' /tmp/qstate.json)"
            S4="$(jq -r --arg id "$ID4" '.items[] | select(.id==$id) | .status' /tmp/qstate.json)"
            echo "queue attempt=$attempt q1=$S1 q3=$S3 q4=$S4"
            if [[ "$S1" = "SUCCESS" && "$S3" = "SUCCESS" && "$S4" = "SUCCESS" ]]; then OK=1; break; fi
            if [[ "$S1" =~ ^(FAILED|CANCELLED|TIMED_OUT|IDE_ERROR)$ || "$S3" =~ ^(FAILED|CANCELLED|TIMED_OUT|IDE_ERROR)$ || "$S4" =~ ^(FAILED|CANCELLED|TIMED_OUT|IDE_ERROR)$ ]]; then cat /tmp/qstate.json; exit 1; fi
            sleep 3
          done
          test "$OK" = "1"

          DONE1="$(jq -r --arg id "$ID1" '.items[] | select(.id==$id) | .completed_at' /tmp/qstate.json)"
          START3="$(jq -r --arg id "$ID3" '.items[] | select(.id==$id) | .started_at' /tmp/qstate.json)"
          DONE3="$(jq -r --arg id "$ID3" '.items[] | select(.id==$id) | .completed_at' /tmp/qstate.json)"
          START4="$(jq -r --arg id "$ID4" '.items[] | select(.id==$id) | .started_at' /tmp/qstate.json)"
          python - "$DONE1" "$START3" "$DONE3" "$START4" <<'PY'
          import sys
          from datetime import datetime
          vals=[datetime.fromisoformat(x.replace('Z','+00:00')) for x in sys.argv[1:]]
          assert vals[1] >= vals[0], vals
          assert vals[3] >= vals[2], vals
          PY

          curl --fail --show-error --silent -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data '{}' "$BASE/api/queue/clear" >/tmp/qclear.json
          jq -e '.ok == true' /tmp/qclear.json >/dev/null

      - name: Clean smoke workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin notion-workspace
          git switch -C notion-workspace origin/notion-workspace
          if [[ -d "$SMOKE_ROOT" ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git rm -r "$SMOKE_ROOT"
            git commit -m 'remove productivity pack smoke files'
            git push origin HEAD:notion-workspace
          fi
