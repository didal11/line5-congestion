name: Notion IDE File Import Smoke

on:
  push:
    branches:
      - feat/ide-file-import
    paths:
      - .github/workflows/notion-ide-file-import-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://line5-notion-ide.alstn101059.workers.dev
      IDE_KEY: ${{ secrets.NOTION_IDE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preview UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$BASE/" > /tmp/ide.html
          grep -q 'id="importFiles"' /tmp/ide.html
          grep -q 'id="filePicker"' /tmp/ide.html
          grep -q 'collectDroppedFiles' /tmp/ide.html

      - name: Import two files in one commit
        id: first
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/import.json <<'JSON'
          {
            "destination": "notion-ide/.import-smoke",
            "overwrite": false,
            "files": [
              {"path": "a.txt", "content_base64": "YWxwaGEK"},
              {"path": "nested/b.bin", "content_base64": "AAEC/w=="}
            ]
          }
          JSON
          HTTP="$(curl --show-error --silent -o /tmp/import-response.json -w '%{http_code}' \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/import.json "$BASE/api/import")"
          cat /tmp/import-response.json
          echo
          test "$HTTP" = "200"
          jq -e '.ok == true and .count == 2 and (.commit_sha | length == 40)' /tmp/import-response.json >/dev/null
          SHA="$(jq -r '.commit_sha' /tmp/import-response.json)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA" > /tmp/commit.json
          jq -e '[.files[].filename] | sort == ["notion-ide/.import-smoke/a.txt","notion-ide/.import-smoke/nested/b.bin"]' /tmp/commit.json >/dev/null

      - name: Reject overwrite without confirmation
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --show-error --silent -o /tmp/conflict.json -w '%{http_code}' \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/import.json "$BASE/api/import")"
          cat /tmp/conflict.json
          echo
          test "$HTTP" = "409"
          jq -e '.conflicts | length == 2' /tmp/conflict.json >/dev/null

      - name: Overwrite both files in one commit
        shell: bash
        run: |
          set -euo pipefail
          jq '.overwrite=true | .files[0].content_base64="YmV0YQo=" | .files[1].content_base64="BAUG/w=="' /tmp/import.json > /tmp/overwrite.json
          HTTP="$(curl --show-error --silent -o /tmp/overwrite-response.json -w '%{http_code}' \
            -H "x-ide-key: $IDE_KEY" -H 'content-type: application/json' \
            -X POST --data-binary @/tmp/overwrite.json "$BASE/api/import")"
          cat /tmp/overwrite-response.json
          echo
          test "$HTTP" = "200"
          jq -e '.ok == true and .count == 2 and (.overwritten | length == 2)' /tmp/overwrite-response.json >/dev/null
          SHA="$(jq -r '.commit_sha' /tmp/overwrite-response.json)"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA" > /tmp/overwrite-commit.json
          jq -e '[.files[].filename] | sort == ["notion-ide/.import-smoke/a.txt","notion-ide/.import-smoke/nested/b.bin"]' /tmp/overwrite-commit.json >/dev/null

      - name: Clean smoke files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin notion-workspace
          git switch -C notion-workspace origin/notion-workspace
          if [[ -d notion-ide/.import-smoke ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git rm -r notion-ide/.import-smoke
            git commit -m 'remove Explorer import smoke files'
            git push origin HEAD:notion-workspace
          fi
